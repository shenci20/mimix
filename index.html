<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小人咪饲养游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #fef8f0;
            --bg-secondary: #fff5e6;
            --text-primary: #5a4a3a;
            --text-secondary: #8a7a6a;
            --accent-warm: #ffb88c;
            --accent-danger: #ff6b6b;
            --accent-safe: #95e1d3;
            --shadow: rgba(90, 74, 58, 0.1);
            --border: #e8d5c4;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-content {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px var(--shadow);
        }

        .overlay-content h2 {
            margin-bottom: 20px;
            color: var(--text-primary);
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: white;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-warm);
        }

        .model-select-row,
        .preset-row {
            display: flex;
            gap: 10px;
        }

        .model-select-row select,
        .preset-row select {
            flex: 1;
        }

        .btn-small {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: var(--accent-warm);
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-small:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 184, 140, 0.4);
        }

        .btn-primary {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            background: var(--accent-warm);
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 184, 140, 0.4);
        }

        .btn-danger {
            background: var(--accent-danger);
        }

        .btn-danger:hover {
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        .overlay-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .timeline {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .timeline-item {
            background: white;
            border-left: 4px solid var(--accent-warm);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .timeline-time {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .timeline-action {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .timeline-reaction {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .timeline-stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .stat-change {
            padding: 3px 8px;
            border-radius: 5px;
            background: #f0f0f0;
        }

        .stat-change.positive {
            color: #27ae60;
            background: #d5f4e6;
        }

        .stat-change.negative {
            color: #e74c3c;
            background: #fadbd8;
        }

        .empty-hint {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
        }

        #app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            box-shadow: 0 0 50px var(--shadow);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--border);
        }

        .location-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-icon {
            font-size: 20px;
        }

        #location-select {
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            font-size: 14px;
            cursor: pointer;
        }

        .time-display {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .icon-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .main-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .status-atmosphere {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s;
            position: relative;
        }

        .status-atmosphere.danger {
            background: radial-gradient(circle, rgba(255, 107, 107, 0.1) 0%, transparent 70%);
        }

        .status-atmosphere.weak {
            background: radial-gradient(circle, rgba(255, 184, 140, 0.1) 0%, transparent 70%);
        }

        .status-atmosphere.normal {
            background: radial-gradient(circle, rgba(149, 225, 211, 0.1) 0%, transparent 70%);
        }

        .mimi-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .mimi-avatar {
            position: relative;
            width: 200px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mimi-body {
            width: 140px;
            height: 200px;
            background: linear-gradient(180deg, #ffd4a3 0%, #ffb88c 100%);
            border-radius: 70px 70px 40px 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(255, 184, 140, 0.3);
            transition: all 0.5s;
        }

        .mimi-face {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 80px;
        }

        .mimi-eyes {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }

        .eye {
            width: 12px;
            height: 12px;
            background: #5a4a3a;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }

        .mimi-eyes.closed .eye {
            height: 2px;
            border-radius: 2px;
        }

        .mimi-eyes.tired .eye {
            height: 6px;
        }

        .mimi-mouth {
            width: 30px;
            height: 15px;
            border: 2px solid #5a4a3a;
            border-top: none;
            border-radius: 0 0 15px 15px;
            margin: 0 auto;
            transition: all 0.3s;
        }

        .mimi-mouth.sad {
            border-bottom: none;
            border-top: 2px solid #5a4a3a;
            border-radius: 15px 15px 0 0;
        }

        .mimi-mouth.sick {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #5a4a3a;
        }

        .mimi-cheeks {
            display: flex;
            justify-content: space-between;
            position: absolute;
            width: 120px;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
        }

        .cheek {
            width: 20px;
            height: 15px;
            background: rgba(255, 150, 150, 0.3);
            border-radius: 50%;
            transition: all 0.3s;
        }

        .cheek.flushed {
            background: rgba(255, 150, 150, 0.6);
        }

        .mimi-accessories {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .oxygen-tube {
            position: absolute;
            top: 40px;
            right: -10px;
            width: 40px;
            height: 60px;
            border: 3px solid #95e1d3;
            border-left: none;
            border-radius: 0 20px 20px 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .oxygen-tube::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #95e1d3;
            border-radius: 50%;
            top: 50%;
            right: 5px;
            transform: translateY(-50%);
            animation: pulse 1.5s infinite;
        }

        .oxygen-tube:not(.hidden) {
            opacity: 1;
        }

        .blanket {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 100px;
            background: linear-gradient(180deg, transparent 0%, #ffb88c 40%, #ff9966 100%);
            border-radius: 60px 60px 40px 40px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .blanket:not(.hidden) {
            opacity: 0.7;
        }

        .mimi-effects {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .effect-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent-safe);
            border-radius: 50%;
            animation: float-up 2s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.5);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: translateY(-50%) scale(1);
            }
            50% {
                opacity: 0.5;
                transform: translateY(-50%) scale(1.2);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-2deg); }
            75% { transform: translateX(-50%) rotate(2deg); }
        }

        .mimi-body.shaking {
            animation: shake 0.5s infinite;
        }

        .speech-bubble {
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px var(--shadow);
            position: relative;
            max-width: 280px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid white;
        }

        #bubble-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
            text-align: center;
        }

        .status-label {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .health-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-top: 2px solid var(--border);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .stat-item:hover {
            transform: scale(1.05);
        }

        .stat-ring {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .stat-ring svg {
            transform: rotate(-90deg);
        }

        .stat-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 3;
        }

        .stat-fill {
            fill: none;
            stroke: var(--accent-safe);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            transition: stroke-dashoffset 0.5s, stroke 0.5s;
        }

        .stat-item[data-stat="stamina"] .stat-fill {
            stroke: #ffd93d;
        }

        .stat-item[data-stat="oxygen"] .stat-fill {
            stroke: #95e1d3;
        }

        .stat-item[data-stat="stomach"] .stat-fill {
            stroke: #ffb88c;
        }

        .stat-item[data-stat="mood"] .stat-fill {
            stroke: #ff9ff3;
        }

        .stat-item[data-stat="temperature"] .stat-fill {
            stroke: #ff6b6b;
        }

        .stat-item[data-stat="sleep"] .stat-fill {
            stroke: #a29bfe;
        }

        .stat-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-name {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .action-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 20px;
            background: white;
            border-top: 2px solid var(--border);
        }

        .action-btn {
            padding: 15px 10px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px var(--shadow);
            border-color: var(--accent-warm);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .action-icon {
            font-size: 24px;
        }

        .quick-access {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: var(--bg-secondary);
            border-top: 2px solid var(--border);
        }

        .quick-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .quick-btn:hover {
            background: var(--accent-warm);
            color: white;
            border-color: var(--accent-warm);
        }

        @media (max-width: 480px) {
            #app {
                max-width: 100%;
            }

            .health-panel {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                padding: 15px;
            }

            .stat-ring {
                width: 50px;
                height: 50px;
            }

            .stat-value {
                font-size: 14px;
            }

            .action-panel {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
                padding: 15px;
            }

            .action-btn {
                padding: 12px 8px;
                font-size: 12px;
            }

            .action-icon {
                font-size: 20px;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 6px 25px var(--shadow);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .notification.show {
            opacity: 1;
        }

        .notification.error {
            background: #ff6b6b;
            color: white;
        }

        .notification.success {
            background: #95e1d3;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div id="notification" class="notification"></div>

    <div id="settings-overlay" class="overlay hidden">
        <div class="overlay-content settings-panel">
            <h2>API 设置</h2>
            <div class="form-group">
                <label>API 地址</label>
                <input type="text" id="api-url" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
            </div>
            <div class="form-group">
                <label>API Key</label>
                <input type="password" id="api-key" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label>模型选择</label>
                <div class="model-select-row">
                    <select id="model-select">
                        <option value="">请先拉取模型列表</option>
                    </select>
                    <button id="fetch-models-btn" class="btn-small">拉取模型</button>
                </div>
            </div>
            <div class="form-group">
                <label>系统预设 (System Prompt)</label>
                <textarea id="system-prompt" rows="6" placeholder="输入系统预设...">你是小人咪的饲养员助手。请根据咪当前的健康状态、执行的操作和环境，生成真实细腻的反应描述。

咪的设定：
- 身高172cm，体重84斤，体弱多病
- 患有心功能不全、肌无力、肠胃炎、胃轻瘫
- 消化功能很差，吃完东西不揉胃就会吐
- 性格温顺安静，即使难受也不会大声哭闹

描写要求：
- 文笔真实细腻，电影质感，文风成熟
- 详细描写场景、动作、神态、外貌
- 符合都市架空特点
- 不要一次性推动过多情节
- 根据当前状态生成50-150字的即时反应</textarea>
            </div>
            <div class="form-group">
                <label>预设管理</label>
                <div class="preset-row">
                    <select id="preset-select">
                        <option value="">选择已保存的预设</option>
                    </select>
                    <button id="load-preset-btn" class="btn-small">加载</button>
                    <button id="save-preset-btn" class="btn-small">保存</button>
                    <button id="delete-preset-btn" class="btn-small btn-danger">删除</button>
                </div>
            </div>
            <div class="form-group">
                <label>存档管理</label>
                <div class="preset-row">
                    <select id="save-slot-select">
                        <option value="">选择存档槽位</option>
                        <option value="slot1">存档 1</option>
                        <option value="slot2">存档 2</option>
                        <option value="slot3">存档 3</option>
                    </select>
                    <button id="save-game-btn" class="btn-small">保存进度</button>
                    <button id="load-game-btn" class="btn-small">读取进度</button>
                </div>
            </div>
            <div class="overlay-buttons">
                <button id="settings-close-btn" class="btn-primary">确定</button>
            </div>
        </div>
    </div>

    <div id="history-overlay" class="overlay hidden">
        <div class="overlay-content history-panel">
            <h2>饲养历史</h2>
            <div id="history-timeline" class="timeline">
                <p class="empty-hint">还没有饲养记录...</p>
            </div>
            <div class="overlay-buttons">
                <button id="history-close-btn" class="btn-primary">关闭</button>
                <button id="history-clear-btn" class="btn-danger">清空记录</button>
            </div>
        </div>
    </div>

    <div id="app">
        <header class="top-bar">
            <div class="location-selector">
                <span class="location-icon">📍</span>
                <select id="location-select">
                    <option value="bedroom">卧室</option>
                    <option value="livingroom">客厅</option>
                    <option value="balcony">阳台</option>
                    <option value="outdoor">户外</option>
                </select>
            </div>
            <div class="time-display">
                <span id="game-time">冬 · 下午</span>
            </div>
            <div class="top-actions">
                <button id="history-btn" class="icon-btn" title="饲养历史">📋</button>
                <button id="settings-btn" class="icon-btn" title="设置">⚙️</button>
            </div>
        </header>

        <main class="main-area">
            <div class="status-atmosphere weak" id="atmosphere">
                <div class="mimi-container">
                    <div class="mimi-avatar" id="mimi-avatar">
                        <div class="mimi-body">
                            <div class="mimi-face" id="mimi-face">
                                <div class="mimi-eyes tired" id="mimi-eyes">
                                    <span class="eye left"></span>
                                    <span class="eye right"></span>
                                </div>
                                <div class="mimi-mouth" id="mimi-mouth"></div>
                                <div class="mimi-cheeks">

        <section class="health-panel">

        <section class="action-panel">
            <button class="action-btn" data-action="feed">
                <span class="action-icon">🍚</span>
                <span>喂食</span>
            </button>
            <button class="action-btn" data-action="massage">
                <span class="action-icon">👐</span>
                <span>揉胃</span>
            </button>
            <button class="action-btn" data-action="oxygen">
                <span class="action-icon">💨</span>
                <span>吸氧</span>
            </button>
            <button class="action-btn" data-action="warm">
                <span class="action-icon">🔥</span>
                <span>保暖</span>

            <button class="action-btn" data-action="comfort">
                <span class="action-icon">💕</span>
                <span>安抚</span>
            </button>
            <button class="action-btn" data-action="sleep">
                <span class="action-icon">😴</span>
                <span>哄睡</span>
            </button>
            <button class="action-btn" data-action="wake">
                <span class="action-icon">🔔</span>
                <span>轻唤</span>
            </button>
            <button class="action-btn" data-action="play">
                <span class="action-icon">🎮</span>
                <span>陪玩</span>
            </button>
        </section>

        <section class="quick-access">
            <button id="quick-history-btn" class="quick-btn">饲养历史</button>
            <button id="quick-status-btn" class="quick-btn">状态详情</button>
        </section>
    </div>

    <script>
        // ==================== 游戏状态管理 ====================
        const gameState = {
            stats: {
                stamina: 25,
                oxygen: 65,
                stomach: 35,
                mood: 45,
                temperature: 30,
                sleep: 40
            },
            location: 'bedroom',
            time: 0,
            isAsleep: false,
            hasOxygen: false,
            hasBlanket: false,
            lastMassageTime: 0,
            history: []
        };

        // ==================== API 配置 ====================
        const apiConfig = {
            url: 'https://api.openai.com/v1',
            key: '',
            model: '',
            systemPrompt: ''
        };

        // ==================== 地点配置 ====================
        const locationEffects = {
            bedroom: { stamina: -0.5, temperature: 0, mood: 0.2, sleep: 0.3 },
            livingroom: { stamina: -0.3, temperature: -0.2, mood: 0.3, sleep: 0 },
            balcony: { stamina: -0.8, temperature: -0.5, mood: 0.5, sleep: -0.2 },
            outdoor: { stamina: -1.2, temperature: -0.8, mood: 0.8, sleep: -0.5 }
        };

        // ==================== 初始化 ====================
        function init() {
            loadSettings();
            loadPresets();
            updateUI();
            startGameLoop();
            bindEvents();
        }

        // ==================== 事件绑定 ====================
        function bindEvents() {
            // 设置面板
            document.getElementById('settings-btn').addEventListener('click', () => {
                document.getElementById('settings-overlay').classList.remove('hidden');
            });
            document.getElementById('settings-close-btn').addEventListener('click', () => {
                saveSettings();
                document.getElementById('settings-overlay').classList.add('hidden');
            });

            // 历史面板
            document.getElementById('history-btn').addEventListener('click', showHistory);
            document.getElementById('quick-history-btn').addEventListener('click', showHistory);
            document.getElementById('history-close-btn').addEventListener('click', () => {
                document.getElementById('history-overlay').classList.add('hidden');
            });
            document.getElementById('history-clear-btn').addEventListener('click', () => {
                if (confirm('确定要清空所有饲养记录吗？')) {
                    gameState.history = [];
                    showHistory();
                    showNotification('已清空饲养记录', 'success');
                }
            });

            // 拉取模型
            document.getElementById('fetch-models-btn').addEventListener('click', fetchModels);

            // 预设管理
            document.getElementById('save-preset-btn').addEventListener('click', savePreset);
            document.getElementById('load-preset-btn').addEventListener('click', loadPreset);
            document.getElementById('delete-preset-btn').addEventListener('click', deletePreset);

            // 存档管理
            document.getElementById('save-game-btn').addEventListener('click', saveGame);
            document.getElementById('load-game-btn').addEventListener('click', loadGame);

            // 地点切换
            document.getElementById('location-select').addEventListener('change', (e) => {
                gameState.location = e.target.value;
                showNotification(`已切换到${getLocationName(e.target.value)}`, 'success');
            });

            // 操作按钮
            document.querySelectorAll('.action-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.action;
                    performAction(action);
                });
            });

            // 状态详情
            document.getElementById('quick-status-btn').addEventListener('click', () => {
                showNotification('状态详情功能开发中...', 'success');
            });
        }

        // ==================== API 相关 ====================
        async function fetchModels() {
            const url = document.getElementById('api-url').value.trim();
            const key = document.getElementById('api-key').value.trim();

            if (!url || !key) {
                showNotification('请先填写 API 地址和 Key', 'error');
                return;
            }

            const btn = document.getElementById('fetch-models-btn');
            btn.innerHTML = '<span class="loading"></span>';
            btn.disabled = true;

            try {
                const response = await fetch(`${url}/models`, {
                    headers: {
                        'Authorization': `Bearer ${key}`
                    }
                });

                if (!response.ok) throw new Error('获取模型列表失败');

                const data = await response.json();
                const select = document.getElementById('model-select');
                select.innerHTML = '<option value="">选择模型</option>';
                
                data.data.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.id;
                    option.textContent = model.id;
                    select.appendChild(option);
                });

                showNotification('模型列表获取成功', 'success');
            } catch (error) {
                showNotification('获取模型失败: ' + error.message, 'error');
            } finally {
                btn.innerHTML = '拉取模型';
                btn.disabled = false;
            }
        }

        async function callAPI(prompt) {
            if (!apiConfig.url || !apiConfig.key || !apiConfig.model) {
                return '(⁎˃ᆺ˂) ...咪还没有连接到 AI...请先在设置中配置 API...';
            }

            try {
                const response = await fetch(`${apiConfig.url}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiConfig.key}`
                    },
                    body: JSON.stringify({
                        model: apiConfig.model,
                        messages: [
                            { role: 'system', content: apiConfig.systemPrompt },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.8,
                        max_tokens: 300
                    })
                });

                if (!response.ok) throw new Error('API 调用失败');

                const data = await response.json();
                return data.choices[0].message.content.trim();
            } catch (error) {
                console.error('API Error:', error);
                return '(｡•́︿•̀｡) ...咪感觉有点不舒服...无法表达...';
            }
        }

        // ==================== 操作执行 ====================
        async function performAction(action) {
            // 检查操作条件
            const canPerform = checkActionCondition(action);
            if (!canPerform.allowed) {
                showNotification(canPerform.reason, 'error');
                return;
            }

            // 禁用所有按钮
            const buttons = document.querySelectorAll('.action-btn');
            buttons.forEach(btn => btn.disabled = true);

            // 执行操作效果
            const effects = getActionEffects(action);
            applyEffects(effects);

            // 生成 AI 反应
            const prompt = generatePrompt(action, effects);
            const reaction = await callAPI(prompt);

            // 更新气泡文本
            document.getElementById('bubble-text').textContent = reaction;

            // 记录历史
            addHistory(action, reaction, effects);

            // 更新 UI
            updateUI();
            updateAppearance();

            // 重新启用按钮
            setTimeout(() => {
                buttons.forEach(btn => btn.disabled = false);
            }, 1000);
        }

        function checkActionCondition(action) {
            const s = gameState.stats;

            switch (action) {
                case 'feed':
                    if (s.stomach < 20 && Date.now() - gameState.lastMassageTime > 300000) {
                        return { allowed: false, reason: '咪的胃部太不舒服了，需要先揉胃...' };
                    }
                    if (s.stomach > 80) {
                        return { allowed: false, reason: '咪现在不饿，不需要吃东西...' };
                    }
                    return { allowed: true };

                case 'massage':
                    return { allowed: true };

                case 'oxygen':
                    if (s.oxygen > 80) {
                        return { allowed: false, reason: '咪现在不需要吸氧...' };
                    }
                    return { allowed: true };

                case 'warm':
                    if (s.temperature > 70) {
                        return { allowed: false, reason: '咪现在不冷...' };
                    }
                    return { allowed: true };

                case 'comfort':
                    return { allowed: true };

                case 'sleep':
                    if (s.stamina > 50) {
                        return { allowed: false, reason: '咪现在还不困...' };
                    }
                    if (s.mood < 10) {
                        return { allowed: false, reason: '咪情绪太低落，无法入睡...' };
                    }
                    return { allowed: true };

                case 'wake':
                    if (!gameState.isAsleep) {
                        return { allowed: false, reason: '咪现在是醒着的...' };
                    }
                    return { allowed: true };

                case 'play':
                    if (s.stamina < 20) {
                        return { allowed: false, reason: '咪太累了，没有力气玩...' };
                    }
                    if (gameState.isAsleep) {
                        return { allowed: false, reason: '咪正在睡觉...' };
                    }
                    return { allowed: true };

                default:
                    return { allowed: true };
            }
        }

        function getActionEffects(action) {
            const effects = {
                stamina: 0,
                oxygen: 0,
                stomach: 0,
                mood: 0,
                temperature: 0,
                sleep: 0
            };

            const s = gameState.stats;

            switch (action) {
                case 'feed':
                    if (s.stomach < 20 && Date.now() - gameState.lastMassageTime > 300000) {
                        // 胃部不适时喂食会呕吐
                        effects.stomach = -15;
                        effects.mood = -25;
                        effects.stamina = -10;
                    } else {
                        effects.stomach = 30;
                        effects.stamina = 10;
                        effects.mood = 5;
                    }
                    break;

                case 'massage':
                    effects.stomach = 20;
                    effects.mood = 10;
                    gameState.lastMassageTime = Date.now();
                    break;

                case 'oxygen':
                    effects.oxygen = 30;
                    effects.stamina = 5;
                    gameState.hasOxygen = true;
                    setTimeout(() => {
                        gameState.hasOxygen = false;
                        updateAppearance();
                    }, 10000);
                    break;

                case 'warm':
                    effects.mood = 10;
                    gameState.hasBlanket = true;
                    setTimeout(() => {
                        gameState.hasBlanket = false;
                        updateAppearance();
                    }, 15000);
                    break;

                case 'comfort':
                    effects.mood = 20;
                    effects.stamina = 5;
                    break;

                case 'sleep':
                    gameState.isAsleep = true;
                    effects.sleep = 40;
                    effects.stamina = 30;
                    setTimeout(() => {
                        gameState.isAsleep = false;
                        updateAppearance();
                    }, 20000);
                    break;

                case 'wake':
                    gameState.isAsleep = false;
                    effects.mood = -10;
                    effects.sleep = -15;
                    break;

                case 'play':
                    effects.mood = 25;
                    effects.stamina = -15;
                    effects.sleep = -10;
                    break;
            }

            return effects;
        }

        function applyEffects(effects) {
            for (const stat in effects) {
                gameState.stats[stat] = Math.max(0, Math.min(100, gameState.stats[stat] + effects[stat]));
            }

            // 状态联动
            applyStateLinkage();
        }

        function applyStateLinkage() {
            const s = gameState.stats;

            // 胃部 < 50 影响情绪
            if (s.stomach < 50) {
                s.mood = Math.max(0, s.mood - 0.5);
            }

            // 体力 < 30 影响血氧
            if (s.stamina < 30) {
                s.oxygen = Math.max(0, s.oxygen - 0.3);
            }

            // 血氧 < 40 影响体力和情绪
            if (s.oxygen < 40) {
                s.stamina = Math.max(0, s.stamina - 0.5);
                s.mood = Math.max(0, s.mood - 0.3);
            }

            // 情绪 < 30 影响胃部消化
            if (s.mood < 30) {
                s.stomach = Math.max(0, s.stomach - 0.2);
            }

            // 体温 < 40 影响体力和情绪
            if (s.temperature < 40) {
                s.stamina = Math.max(0, s.stamina - 0.3);
                s.mood = Math.max(0, s.mood - 0.2);
            }

            // 睡眠 < 20 影响所有恢复速率
            if (s.sleep < 20) {
                // 这个在游戏循环中处理
            }
        }

        function generatePrompt(action, effects) {
            const s = gameState.stats;
            const location = getLocationName(gameState.location);
            
            let actionDesc = '';
            switch (action) {
                case 'feed': actionDesc = '喂食'; break;
                case 'massage': actionDesc = '揉胃'; break;
                case 'oxygen': actionDesc = '吸氧'; break;
                case 'warm': actionDesc = '保暖'; break;
                case 'comfort': actionDesc = '安抚'; break;
                case 'sleep': actionDesc = '哄睡'; break;
                case 'wake': actionDesc = '轻唤'; break;
                case 'play': actionDesc = '陪玩'; break;
            }

            const prompt = `当前场景：${location}，冬天下午

咪的当前状态：
- 体力：${s.stamina}/100 ${s.stamina < 30 ? '(非常疲惫)' : s.stamina < 60 ? '(有些累)' : ''}
- 血氧：${s.oxygen}/100 ${s.oxygen < 40 ? '(呼吸困难)' : s.oxygen < 70 ? '(有些喘)' : ''}
- 胃部：${s.stomach}/100 ${s.stomach < 30 ? '(胃很难受)' : s.stomach < 60 ? '(胃不太舒服)' : ''}
- 情绪：${s.mood}/100 ${s.mood < 30 ? '(很低落)' : s.mood < 60 ? '(有些不安)' : ''}
- 体温：${s.temperature}/100 ${s.temperature < 40 ? '(很冷)' : s.temperature < 60 ? '(有点冷)' : ''}
- 睡眠：${s.sleep}/100 ${s.sleep < 30 ? '(极度困倦)' : s.sleep < 60 ? '(有些困)' : ''}

刚刚执行的操作：${actionDesc}

操作效果：
${Object.entries(effects).filter(([k, v]) => v !== 0).map(([k, v]) => {
    const names = {stamina: '体力', oxygen: '血氧', stomach: '胃部', mood: '情绪', temperature: '体温', sleep: '睡眠'};
    return `- ${names[k]} ${v > 0 ? '+' : ''}${v}`;
}).join('\n')}

请生成咪对这个操作的即时反应（50-150字），包括：
1. 身体感受和动作
2. 表情和神态变化
3. 可能发出的声音（如果有）
4. 简短的内心感受

注意：咪性格温顺安静，即使难受也不会大声哭闹。`;

            return prompt;
        }

        // ==================== UI 更新 ====================
        function updateUI() {
            // 更新所有状态环
            for (const stat in gameState.stats) {
                const value = gameState.stats[stat];
                const ring = document.getElementById(`ring-${stat}`);
                const valueEl = document.getElementById(`val-${stat}`);
                
                if (ring && valueEl) {
                    const offset = 100 - value;
                    ring.style.strokeDashoffset = offset;
                    valueEl.textContent = Math.round(value);

                    // 根据数值改变颜色
                    if (value < 30) {
                        ring.style.stroke = '#ff6b6b';
                    } else if (value < 60) {
                        ring.style.stroke = '#ffb88c';
                    } else {
                        // 恢复原始颜色
                        ring.style.stroke = '';
                    }
                }
            }

            // 更新状态标签和氛围
            updateStatusLabel();
        }

        function updateStatusLabel() {
            const s = gameState.stats;
            const label = document.getElementById('status-label');
            const atmosphere = document.getElementById('atmosphere');

            // 计算最低指标
            const minStat = Math.min(...Object.values(s));

            let status = '';
            let atmosphereClass = '';

            if (minStat < 20) {
                status = '状态：危险';
                atmosphereClass = 'danger';
            } else if (minStat < 40) {
                status = '状态：虚弱';
                atmosphereClass = 'weak';
            } else if (minStat < 60) {
                status = '状态：一般';
                atmosphereClass = 'weak';
            } else {
                status = '状态：良好';
                atmosphereClass = 'normal';
            }

            label.textContent = status;
            atmosphere.className = `status-atmosphere ${atmosphereClass}`;
        }

        function updateAppearance() {
            const s = gameState.stats;
            const eyes = document.getElementById('mimi-eyes');
            const mouth = document.getElementById('mimi-mouth');
            const body = document.querySelector('.mimi-body');
            const cheeks = document.querySelectorAll('.cheek');
            const oxygenTube = document.getElementById('oxygen-tube');
            const blanket = document.getElementById('blanket');

            // 眼睛状态
            eyes.className = 'mimi-eyes';
            if (gameState.isAsleep || s.sleep < 20) {
                eyes.classList.add('closed');
            } else if (s.stamina < 30 || s.sleep < 40) {
                eyes.classList.add('tired');
            }

            // 嘴巴状态
            mouth.className = 'mimi-mouth';
            if (s.stomach < 30) {
                mouth.classList.add('sick');
            } else if (s.mood < 30) {
                mouth.classList.add('sad');
            }

            // 身体状态
            body.classList.remove('shaking');
            if (s.temperature < 30 || s.stomach < 20) {
                body.classList.add('shaking');
            }

            // 脸颊
            cheeks.forEach(cheek => {
                cheek.classList.remove('flushed');
                if (s.temperature < 40 || s.stamina < 20) {
                    cheek.classList.add('flushed');
                }
            });

            // 配件
            if (gameState.hasOxygen) {
                oxygenTube.classList.remove('hidden');
            } else {
                oxygenTube.classList.add('hidden');
            }

            if (gameState.hasBlanket) {
                blanket.classList.remove('hidden');
            } else {
                blanket.classList.add('hidden');
            }

            // 特效
            if (s.mood > 70) {
                createParticles();
            }
        }

        function createParticles() {
            const effects = document.getElementById('mimi-effects');
            const particle = document.createElement('div');
            particle.className = 'effect-particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            effects.appendChild(particle);

            setTimeout(() => particle.remove(), 2000);
        }

        // ==================== 游戏循环 ====================
        function startGameLoop() {
            setInterval(() => {
                gameState.time += 1;

                // 应用地点效果
                const locationEffect = locationEffects[gameState.location];
                for (const stat in locationEffect) {
                    gameState.stats[stat] = Math.max(0, Math.min(100, 
                        gameState.stats[stat] + locationEffect[stat]
                    ));
                }

                // 自然衰减
                if (!gameState.isAsleep) {
                    gameState.stats.stamina = Math.max(0, gameState.stats.stamina - 0.3);
                    gameState.stats.sleep = Math.max(0, gameState.stats.sleep - 0.2);
                }

                gameState.stats.oxygen = Math.max(0, gameState.stats.oxygen - 0.2);
                gameState.stats.stomach = Math.max(0, gameState.stats.stomach - 0.15);

                // 睡眠影响恢复速率
                if (gameState.stats.sleep < 20) {
                    // 所有恢复减半（在操作效果中体现）
                }

                // 状态联动
                applyStateLinkage();

                // 更新 UI
                updateUI();
                updateAppearance();

                // 更新时间显示
                updateTimeDisplay();
            }, 3000); // 每3秒更新一次
        }

        function updateTimeDisplay() {
            const hours = Math.floor(gameState.time / 20) % 24;
            let period = '';
            
            if (hours >= 6 && hours < 12) period = '早晨';
            else if (hours >= 12 && hours < 18) period = '下午';
            else if (hours >= 18 && hours < 22) period = '傍晚';
            else period = '深夜';

            document.getElementById('game-time').textContent = `冬 · ${period}`;
        }

        // ==================== 历史记录 ====================
        function addHistory(action, reaction, effects) {
            const actionNames = {
                feed: '喂食',
                massage: '揉胃',
                oxygen: '吸氧',
                warm: '保暖',
                comfort: '安抚',
                sleep: '哄睡',
                wake: '轻唤',
                play: '陪玩'
            };

            const statNames = {
                stamina: '体力',
                oxygen: '血氧',
                stomach: '胃部',
                mood: '情绪',
                temperature: '体温',
                sleep: '睡眠'
            };

            const record = {
                time: new Date().toLocaleString('zh-CN'),
                action: actionNames[action],
                reaction: reaction,
                effects: effects,
                statNames: statNames
            };

            gameState.history.unshift(record);
            
            // 只保留最近50条记录
            if (gameState.history.length > 50) {
                gameState.history = gameState.history.slice(0, 50);
            }
        }

        function showHistory() {
            const timeline = document.getElementById('history-timeline');
            
            if (gameState.history.length === 0) {
                timeline.innerHTML = '<p class="empty-hint">还没有饲养记录...</p>';
            } else {
                timeline.innerHTML = gameState.history.map(record => `
                    <div class="timeline-item">
                        <div class="timeline-time">${record.time}</div>
                        <div class="timeline-action">操作：${record.action}</div>
                        <div class="timeline-reaction">${record.reaction}</div>
                        <div class="timeline-stats">
                            ${Object.entries(record.effects)
                                .filter(([k, v]) => v !== 0)
                                .map(([k, v]) => `
                                    <span class="stat-change ${v > 0 ? 'positive' : 'negative'}">
                                        ${record.statNames[k]} ${v > 0 ? '+' : ''}${v}
                                    </span>
                                `).join('')}
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('history-overlay').classList.remove('hidden');
        }

        // ==================== 设置管理 ====================
        function saveSettings() {
            apiConfig.url = document.getElementById('api-url').value.trim();
            apiConfig.key = document.getElementById('api-key').value.trim();
            apiConfig.model = document.getElementById('model-select').value;
            apiConfig.systemPrompt = document.getElementById('system-prompt').value.trim();

            localStorage.setItem('apiConfig', JSON.stringify(apiConfig));
            showNotification('设置已保存', 'success');
        }

        function loadSettings() {
            const saved = localStorage.getItem('apiConfig');
            if (saved) {
                const config = JSON.parse(saved);
                apiConfig.url = config.url || 'https://api.openai.com/v1';
                apiConfig.key = config.key || '';
                apiConfig.model = config.model || '';
                apiConfig.systemPrompt = config.systemPrompt || '';

                document.getElementById('api-url').value = apiConfig.url;
                document.getElementById('api-key').value = apiConfig.key;
                document.getElementById('system-prompt').value = apiConfig.systemPrompt;

                if (apiConfig.model) {
                    const option = document.createElement('option');
                    option.value = apiConfig.model;
                    option.textContent = apiConfig.model;
                    option.selected = true;
                    document.getElementById('model-select').appendChild(option);
                }
            }
        }

        // ==================== 预设管理 ====================
        function loadPresets() {
            const presets = JSON.parse(localStorage.getItem('presets') || '{}');
            const select = document.getElementById('preset-select');
            select.innerHTML = '<option value="">选择已保存的预设</option>';

            for (const name in presets) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            }
        }

        function savePreset() {
            const name = prompt('请输入预设名称：');
            if (!name) return;

            const presets = JSON.parse(localStorage.getItem('presets') || '{}');
            presets[name] = {
                url: document.getElementById('api-url').value,
                key: document.getElementById('api-key').value,
                model: document.getElementById('model-select').value,
                systemPrompt: document.getElementById('system-prompt').value
            };

            localStorage.setItem('presets', JSON.stringify(presets));
            loadPresets();
            showNotification(`预设 "${name}" 已保存`, 'success');
        }

        function loadPreset() {
            const name = document.getElementById('preset-select').value;
            if (!name) {
                showNotification('请先选择一个预设', 'error');
                return;
            }

            const presets = JSON.parse(localStorage.getItem('presets') || '{}');
            const preset = presets[name];

            if (preset) {
                document.getElementById('api-url').value = preset.url;
                document.getElementById('api-key').value = preset.key;
                document.getElementById('system-prompt').value = preset.systemPrompt;

                // 更新模型选择
                const modelSelect = document.getElementById('model-select');
                let found = false;
                for (let i = 0; i < modelSelect.options.length; i++) {
                    if (modelSelect.options[i].value === preset.model) {
                        modelSelect.selectedIndex = i;
                        found = true;
                        break;
                    }
                }

                if (!found && preset.model) {
                    const option = document.createElement('option');
                    option.value = preset.model;
                    option.textContent = preset.model;
                    option.selected = true;
                    modelSelect.appendChild(option);
                }

                showNotification(`已加载预设 "${name}"`, 'success');
            }
        }

        function deletePreset() {
            const name = document.getElementById('preset-select').value;
            if (!name) {
                showNotification('请先选择一个预设', 'error');
                return;
            }

            if (!confirm(`确定要删除预设 "${name}" 吗？`)) return;

            const presets = JSON.parse(localStorage.getItem('presets') || '{}');
            delete presets[name];
            localStorage.setItem('presets', JSON.stringify(presets));
            loadPresets();
            showNotification(`预设 "${name}" 已删除`, 'success');
        }

        // ==================== 存档管理 ====================
        function saveGame() {
            const slot = document.getElementById('save-slot-select').value;
            if (!slot) {
                showNotification('请先选择存档槽位', 'error');
                return;
            }

            const saveData = {
                stats: { ...gameState.stats },
                location: gameState.location,
                time: gameState.time,
                history: [...gameState.history],
                timestamp: new Date().toLocaleString('zh-CN')
            };

            localStorage.setItem(`save_${slot}`, JSON.stringify(saveData));
            showNotification(`进度已保存到 ${slot}`, 'success');
        }

        function loadGame() {
            const slot = document.getElementById('save-slot-select').value;
            if (!slot) {
                showNotification('请先选择存档槽位', 'error');
                return;
            }

            const saveData = localStorage.getItem(`save_${slot}`);
            if (!saveData) {
                showNotification('该槽位没有存档', 'error');
                return;
            }

            if (!confirm(`确定要读取 ${slot} 吗？当前进度将被覆盖。`)) return;

            const data = JSON.parse(saveData);
            gameState.stats = data.stats;
            gameState.location = data.location;
            gameState.time = data.time;
            gameState.history = data.history;

            document.getElementById('location-select').value = data.location;
            updateUI();
            updateAppearance();
            showNotification(`已读取 ${slot} (${data.timestamp})`, 'success');
        }

        // ==================== 工具函数 ====================
        function getLocationName(location) {
            const names = {
                bedroom: '卧室',
                livingroom: '客厅',
                balcony: '阳台',
                outdoor: '户外'
            };
            return names[location] || location;
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // ==================== 启动游戏 ====================
        init();
    </script>
</body>
</html>
